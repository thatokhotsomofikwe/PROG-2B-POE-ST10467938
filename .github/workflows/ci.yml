name: RaceDay Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check-project:
    name: Check RaceDay Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check documentation
        run: |
          test -f docs/RaceDay_ERD.png
          test -f docs/RaceDay_API_Endpoint_Plan.md
          test -f docs/RaceDay_Database.sql

      - name: CI successful
        run: echo "RaceDay project documentation check passed!"
