name: RaceDay Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check-project:
    name: Check RaceDay Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project documentation
        run: |
          test -f README.md
          test -f RaceDay.pdf
          test -f RaceDay_API_Endpoint_Plan.md
          test -f RaceDay_Database.sql

      - name: CI successful
        run: echo "RaceDay project documentation check passed successfully!"
